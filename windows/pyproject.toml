[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kira-ai-pro"
version = "0.1.0"
description = "KIRA AI PRO - Windows tarafı beyin (hafıza, hibrit AI, karakter, güvenlik)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.0",
    "httpx>=0.27",
    "keyring>=25",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kira = "kira.__main__:main"

[tool.setuptools.packages.find]
include = ["kira*"]
