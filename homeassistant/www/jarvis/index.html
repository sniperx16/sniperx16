<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JARVIS</title>
<style>
  html,body{margin:0;height:100%;background:#010409;overflow:hidden}
  #gl,#hud{position:fixed;inset:0;width:100vw;height:100vh;display:block}
  #hud{pointer-events:none}
  .kutu{position:fixed;left:50%;transform:translateX(-50%);font:500 16px Inter,"DejaVu Sans",sans-serif;color:#e6f6ff}
  #sor{bottom:7vh;width:min(640px,80vw);display:none}
  #sor input{width:100%;box-sizing:border-box;padding:14px 18px;border-radius:14px;border:1px solid rgba(53,212,255,.55);
    background:rgba(2,14,24,.85);color:#e6f6ff;font:inherit;outline:none;box-shadow:0 0 24px rgba(53,212,255,.25)}
  #kurulum{top:50%;transform:translate(-50%,-50%);width:min(520px,88vw);display:none;background:rgba(2,14,24,.94);
    border:1px solid rgba(53,212,255,.5);border-radius:16px;padding:22px;box-shadow:0 0 40px rgba(53,212,255,.2)}
  #kurulum h3{margin:0 0 8px;letter-spacing:.12em;color:#35d4ff;font-size:15px}
  #kurulum p{margin:6px 0 12px;font-size:13px;line-height:1.5;color:#a9c3d3}
  #kurulum input{width:100%;box-sizing:border-box;padding:11px 12px;border-radius:10px;border:1px solid #23465a;background:#03121d;color:#e6f6ff;font:13px "JetBrains Mono",monospace}
  #kurulum button{margin-top:12px;padding:10px 16px;border:0;border-radius:10px;background:#35d4ff;color:#02121c;font-weight:700;cursor:pointer}
  #kurulum .ikinci{background:transparent;color:#7f93a6;margin-left:8px}
</style>

{ "imports": { "three": "./lib/three.module.js", "three/addons/": "./lib/addons/" } }

<body>
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>
<div id="sor" class="kutu"><input id="sorGiris" placeholder="Jarvis'e yazın ve Enter'a basın…" autocomplete="off"></div>
<div id="kurulum" class="kutu">
  <h3>HOME ASSISTANT BAĞLANTISI</h3>
  <p>Jarvis'in gerçek verileri göstermesi için bu cihaza bir kez <b>uzun ömürlü erişim jetonu</b> girin.<br>
     Home Assistant → profil (sol alt) → Güvenlik → Uzun ömürlü erişim jetonları → Jeton oluştur.<br>
     Jeton yalnızca bu cihazın tarayıcısında saklanır.</p>
  <input id="jetonGiris" placeholder="eyJhbGciOi…" autocomplete="off">
  <div><button id="jetonKaydet">Bağlan</button><button id="tanitimDevam" class="ikinci">Tanıtım modunda kal</button></div>
</div>
<script type="module">
/* =====================================================================
   Ev Jarvis'i – holografik yüz (three.js)
   Model: "Infinite, 3D Head Scan" – Lee Perry-Smith, CC BY 3.0 (KAYNAKLAR.md)

   Home Assistant'tan açıldığında (http://<HA>:8123/local/jarvis/index.html) otomatik bağlanır:
     ses uydusunun durumu, Jarvis'in cevabı, panellerdeki sensörler canlı gelir (ayarlar.json).
     Ekrana dokun / bir tuşa bas → Jarvis'e yaz; cevap sesli okunur, ağız sese göre hareket eder.

   Kontrol:
     ?demo=1                                          tanıtım modu (bağlanmaz)
     ?ha=http://192.168.1.52:8123                     başka adresteki Home Assistant
     ?durum=bekliyor|dinliyor|dusunuyor|konusuyor   (sabit durum, test için)
     window.jarvisDurum('dinliyor')
     window.jarvisSoyle('Merhaba efendim.')          (altyazı + konuşma)
   ===================================================================== */
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

const RENK = new THREE.Color(0x35d4ff);
const glc = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas: glc, antialias: true, alpha: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x000000, 1);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 200);
camera.position.set(0, 1.0, 19);
camera.lookAt(0, 0.9, 0);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.9, 0.5, 0.12);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ---------------- ortak shader parçaları ---------------- */
const ortak = {
  uZaman: { value: 0 }, uCene: { value: 0 }, uParlak: { value: 0.7 },
  uRenk: { value: RENK }, uTarama: { value: 0 }, uBozulma: { value: 0 },
  uGenis: { value: 0 }, uYuvarlak: { value: 0 }, uGulum: { value: 0 }, uKas: { value: 0 },
};
// Mimikler (modelin ölçülerine göre): dudak çizgisi y≈0.22, ağız köşeleri x≈±0.75, kaşlar y≈2.15
//  uGenis: dudakları yana yay (i, e) · uYuvarlak: dudakları büzüp öne çıkar (o, u)
//  uGulum: ağız köşelerini kaldır · uKas: kaşları kaldır · uCene: çeneyi aç
const deformGLSL = /* glsl */`
  uniform float uZaman, uCene, uBozulma, uGenis, uYuvarlak, uGulum, uKas;
  float gs(vec2 d, vec2 r){ return exp(-dot(d/r, d/r)); }
  vec3 deform(vec3 p0){
    vec3 p = p0;
    float onY = smoothstep(0.6, 1.9, p0.z);                          // yalnızca yüzün ön yüzeyi
    float dudak = gs(vec2(p0.x, p0.y-0.25), vec2(0.95, 0.42)) * onY;
    float yanX = sign(p0.x) * smoothstep(0.05, 0.7, abs(p0.x));
    p.x += yanX * uGenis * 0.24 * dudak;                             // yayma
    p.x -= p0.x * uYuvarlak * 0.45 * dudak;                          // büzme
    p.z += uYuvarlak * 0.32 * dudak;
    float koseler = gs(vec2(abs(p0.x)-0.80, p0.y-0.28), vec2(0.38, 0.30)) * onY;
    p.y += uGulum * 0.26 * koseler;                                  // gülümseme
    p.x += sign(p0.x) * uGulum * 0.06 * koseler;
    float kas = gs(vec2(abs(p0.x)-0.85, p0.y-2.15), vec2(0.65, 0.32)) * onY;
    p.y += uKas * 0.22 * kas;                                        // kaş kaldırma
    float alt = 1.0 - smoothstep(0.17, 0.27, p0.y);         // dudak aralığının (y≈0.25) altı
    float on  = smoothstep(-0.6, 1.2, p0.z);                 // yüzün önü
    float yan = 1.0 - smoothstep(1.6, 3.2, abs(p0.x));       // yanaklara doğru azalır
    float govde = smoothstep(-3.2, -1.2, p0.y);              // boyun sabit
    float w = alt * on * yan * govde;
    float a = uCene * 0.30 * w;
    vec3 piv = vec3(0.0, 0.9, -1.2);
    vec3 q = p - piv;
    float c = cos(a), s = sin(a);
    q = vec3(q.x, c*q.y + s*q.z, -s*q.y + c*q.z);
    p = mix(p, q + piv, step(0.0001, w));
    // hologram bozulması: yatay kayma
    float bant = step(0.985, fract(sin(floor(p.y*6.0 + uZaman*20.0))*43758.5));
    p.x += bant * uBozulma * 0.25;
    return p;
  }`;

const yuzMat = new THREE.ShaderMaterial({
  uniforms: ortak, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.FrontSide,
  vertexShader: deformGLSL + /* glsl */`
    varying vec3 vN; varying vec3 vV; varying vec3 vP;
    void main(){
      vec3 p = deform(position);
      vP = position;
      vec4 mv = modelViewMatrix * vec4(p,1.0);
      vN = normalize(normalMatrix * normal);
      vV = normalize(-mv.xyz);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: /* glsl */`
    uniform float uZaman, uParlak, uTarama, uCene; uniform vec3 uRenk;
    varying vec3 vN; varying vec3 vV; varying vec3 vP;
    float hash(float n){ return fract(sin(n)*43758.5453); }
    void main(){
      float fr = pow(1.0 - abs(dot(normalize(vN), normalize(vV))), 2.4);
      float cizgi = smoothstep(0.82, 1.0, abs(sin(vP.y*26.0 - uZaman*1.5)));     // ince tarama çizgileri
      float tarama = 0.5*exp(-pow((vP.y - uTarama)*3.0, 2.0));                    // aşağı inen ışık bandı
      float kenarAlt = smoothstep(-2.4, -0.8, vP.y);                               // boyun kaybolur
      float titreme = 0.92 + 0.08*hash(floor(uZaman*24.0));
      vec2 dd = vec2(vP.x/0.85, (vP.y-0.24)/0.16);
      float dudakIsik = exp(-dot(dd,dd)) * smoothstep(1.4, 2.0, vP.z) * (0.15 + 0.85*uCene);   // konuşurken dudaklar parlar
      float a = (0.05 + fr*0.85 + cizgi*0.10 + tarama*0.55 + dudakIsik*0.55) * kenarAlt * uParlak * titreme;
      vec3 c = mix(uRenk, vec3(0.85,0.97,1.0), fr*0.5 + tarama*0.4);
      gl_FragColor = vec4(c * a, a);
    }`,
});

const telMat = new THREE.ShaderMaterial({
  uniforms: ortak, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, wireframe: true,
  vertexShader: deformGLSL + /* glsl */`
    varying float vOn; varying float vY;
    void main(){
      vec3 p = deform(position);
      vec4 mv = modelViewMatrix * vec4(p,1.0);
      vOn = clamp(dot(normalize(normalMatrix*normal), normalize(-mv.xyz)), 0.0, 1.0);
      vY = position.y;
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: /* glsl */`
    uniform float uParlak, uTarama; uniform vec3 uRenk; varying float vOn; varying float vY;
    void main(){
      float tarama = 0.6*exp(-pow((vY - uTarama)*3.5, 2.0));
      float a = (0.035 + 0.05*vOn + tarama*0.35) * smoothstep(-2.4,-0.8,vY) * uParlak;
      gl_FragColor = vec4(uRenk * a, a);
    }`,
});

const noktaMat = new THREE.ShaderMaterial({
  uniforms: ortak, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: deformGLSL + /* glsl */`
    attribute float aRast; varying float vA;
    void main(){
      vec3 p = deform(position);
      vec4 mv = modelViewMatrix * vec4(p,1.0);
      float on = clamp(dot(normalize(normalMatrix*normal), normalize(-mv.xyz)), 0.0, 1.0);
      float pirilti = pow(0.5+0.5*sin(uZaman*3.0 + aRast*40.0), 6.0);
      vA = (0.15 + 0.85*pirilti) * on * smoothstep(-2.4,-0.8,position.y) * step(aRast, 0.35);
      gl_PointSize = (1.2 + 2.2*pirilti) * (300.0 / -mv.z) * 0.06;
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: /* glsl */`
    uniform float uParlak; uniform vec3 uRenk; varying float vA;
    void main(){
      float d = length(gl_PointCoord - 0.5); if (d > 0.5) discard;
      float a = vA * (1.0 - d*2.0) * uParlak;
      gl_FragColor = vec4(mix(uRenk, vec3(1.0), 0.6) * a, a);
    }`,
});

/* ---------------- göz parıltısı ---------------- */
function parlamaDokusu(){
  const c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d');
  const g = x.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(0.12,'rgba(190,245,255,0.95)');
  g.addColorStop(0.35,'rgba(53,212,255,0.35)'); g.addColorStop(1,'rgba(53,212,255,0)');
  x.fillStyle = g; x.fillRect(0,0,128,128); return new THREE.CanvasTexture(c);
}
const gozDoku = parlamaDokusu();
const gozler = [-1,1].map(sx => {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: gozDoku, color: 0xffffff, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
  s.position.set(sx*0.62, 1.62, 2.0); s.scale.set(0.6,0.6,1); return s;
});

/* ---------------- kafa ---------------- */
const kafa = new THREE.Group();
scene.add(kafa);
gozler.forEach(g => kafa.add(g));
new GLTFLoader().load('model/LeePerrySmith.glb', gltf => {
  // Doku dikişlerindeki çift köşeleri birleştir → pürüzsüz normaller (dikiş çizgisi görünmez)
  const ham = new THREE.BufferGeometry();
  ham.setAttribute('position', gltf.scene.children[0].geometry.attributes.position);
  ham.setIndex(gltf.scene.children[0].geometry.index);
  const geo = mergeVertices(ham, 1e-3);
  geo.computeVertexNormals();
  const r = new Float32Array(geo.attributes.position.count); for (let i=0;i<r.length;i++) r[i]=Math.random();
  geo.setAttribute('aRast', new THREE.BufferAttribute(r,1));
  // Derinlik ön geçişi: hologram yarı saydam olduğu için ağız/göz içi gibi iç yüzeyler
  // görünmesin diye önce sadece derinlik yazılır, renk yazılmaz.
  const ortu = new THREE.ShaderMaterial({ uniforms: ortak, colorWrite: false, polygonOffset: true, polygonOffsetFactor: 2, polygonOffsetUnits: 4,
    vertexShader: deformGLSL + 'void main(){ gl_Position = projectionMatrix * modelViewMatrix * vec4(deform(position),1.0); }',
    fragmentShader: 'void main(){ gl_FragColor = vec4(0.0); }' });
  const ortuMesh = new THREE.Mesh(geo, ortu); ortuMesh.renderOrder = -1; kafa.add(ortuMesh);
  kafa.add(new THREE.Mesh(geo, yuzMat));
  kafa.add(new THREE.Mesh(geo, telMat));
  kafa.add(new THREE.Points(geo, noktaMat));
  window.jarvisHazir = true;
});

/* ---------------- arka plan parçacıkları ---------------- */
{
  const n = 900, p = new Float32Array(n*3);
  for (let i=0;i<n;i++){ const r = 7+Math.random()*9, a = Math.random()*Math.PI*2;
    p[i*3]=Math.cos(a)*r; p[i*3+1]=(Math.random()-0.5)*14; p[i*3+2]=Math.sin(a)*r-4; }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p,3));
  const toz = new THREE.Points(g, new THREE.PointsMaterial({ color: 0x2aa8d8, size: 0.05, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending, depthWrite:false }));
  toz.name = 'toz'; scene.add(toz);
}

/* ---------------- durum ---------------- */
const params = new URLSearchParams(location.search);
let durum = params.get('durum') || 'bekliyor';
let tanitim = !params.get('durum');          // HA'ya bağlanınca kapanır
let altyazi = params.get('metin') || '', altyaziBas = 0, konusmaBitis = 0;
let duyulan = '';                            // kullanıcının söylediği/yazdığı son cümle
let sesSeviyesi = 0;                         // çalan sesin anlık şiddeti (0–1)
window.jarvisDurum = d => { durum = d; };
// Konuşma hızı (harf/sn). Gerçek ses çalarken sesin süresine göre ayarlanır.
const HIZ_VARSAYILAN = 14;
let HIZ = HIZ_VARSAYILAN;
const konusmaSuresi = m => m.length / HIZ_VARSAYILAN + 0.6;
// sure: saniye; null → durum dışarıdan (HA) bitirilene kadar konuşur
window.jarvisSoyle = (m, sure) => { altyazi = m; altyaziBas = zaman(); durum = 'konusuyor';
  konusmaBitis = sure === null ? 0 : zaman() + (sure || konusmaSuresi(m)); };
const M1 = 'İyi akşamlar efendim. Salon yirmi iki derece, tüm sistemler normal çalışıyor.';
const M2 = 'Bilgisayarınızı açtım. Kapıda kimse yok, alarm devrede.';
const SENARYO = [
  ['bekliyor', 2.4, ''],
  ['dinliyor', 2.2, ''],
  ['dusunuyor', 1.4, ''],
  ['konusuyor', konusmaSuresi(M1), M1],
  ['bekliyor', 1.2, ''],
  ['dinliyor', 1.8, ''],
  ['dusunuyor', 1.2, ''],
  ['konusuyor', konusmaSuresi(M2), M2],
];

/* ---------------- dudak senkronu: Türkçe harf → ağız şekli ----------------
   [çene, yayma, büzme]  */
const VISEME = {};
const ata = (harfler, v) => [...harfler].forEach(h => VISEME[h] = v);
ata('aâ',   [1.00, 0.25, 0.00]);
ata('e',    [0.65, 0.65, 0.00]);
ata('ıi',   [0.35, 0.85, 0.00]);
ata('oö',   [0.70, 0.00, 0.80]);
ata('uü',   [0.35, 0.00, 1.00]);
ata('mbp',  [0.00, 0.00, 0.15]);
ata('fv',   [0.15, 0.35, 0.00]);
ata('şcçj', [0.30, 0.00, 0.55]);
ata('szdtnlrgğkyh', [0.30, 0.30, 0.00]);
const SESSIZLIK = [0.03, 0.05, 0.00];
function viseme(metin, sure){                 // sure: konuşmanın başından beri geçen sn
  const k = sure * HIZ, i = Math.floor(k), f = k - i;
  const harf = c => VISEME[(c || ' ').toLocaleLowerCase('tr-TR')] || SESSIZLIK;
  const a = harf(metin[i]), b = harf(metin[i+1]);
  const e = f*f*(3-2*f);                      // yumuşak geçiş
  return [0,1,2].map(j => a[j]*(1-e) + b[j]*e);
}
const SENARYO_SURE = SENARYO.reduce((a,s)=>a+s[1],0);
const ETIKET = { bekliyor:'BEKLEMEDE', dinliyor:'DİNLİYORUM', dusunuyor:'İŞLENİYOR', konusuyor:'YANITLIYOR' };
const DURUM_RENK = { bekliyor:'#7f93a6', dinliyor:'#3ddc97', dusunuyor:'#a58bff', konusuyor:'#35d4ff' };

// Kayıt için sabit zaman: window.__kare (30 fps)
const t0 = performance.now();
const zaman = () => (window.__kare !== undefined ? window.__kare/30 : (performance.now()-t0)/1000);

/* =====================================================================
   Home Assistant bağlantısı
   ===================================================================== */
const DEMO_SOL = [
  { baslik:'SİSTEM DURUMU', satirlar:[['ÇEKİRDEK','ÇEVRİMİÇİ','#3ddc97'],['YEREL ZEKÂ','HAZIR','#3ddc97'],['CLAUDE','BAĞLI','#3ddc97'],
    ['ZIGBEE AĞI','9 CİHAZ'],['KAMERALAR','2 / 2 CANLI'],['SON YEDEK','03:00 ✓']] },
  { baslik:'EV', satirlar:[['SALON','22,4°C  %48'],['YATAK ODASI','20,1°C  %51'],['MUTFAK','21,7°C'],['KAPI','KİLİTLİ','#3ddc97'],['ALARM','DEVREDE','#3ddc97']] },
];
const DEMO_SAG = [
  { baslik:'MİNİ PC', satirlar:[['İŞLEMCİ','16%'],['RAM','14,2 / 24 GB'],['DİSK','96 / 500 GB'],['AĞ','1,2 MB/s']] },
];
const HAVA_TR = { 'clear-night':'AÇIK', 'cloudy':'BULUTLU', 'fog':'SİSLİ', 'hail':'DOLU', 'lightning':'ŞİMŞEKLİ',
  'lightning-rainy':'FIRTINALI', 'partlycloudy':'PARÇALI BULUTLU', 'pouring':'SAĞANAK', 'rainy':'YAĞMURLU', 'snowy':'KARLI',
  'snowy-rainy':'KARLA KARIŞIK', 'sunny':'GÜNEŞLİ', 'windy':'RÜZGÂRLI', 'windy-variant':'RÜZGÂRLI', 'exceptional':'OLAĞANDIŞI' };
const YESIL = '#3ddc97', KIRMIZI = '#ff6b6b', SARI = '#ffb547';

const HA = (() => {
  let ayar = {}, ws = null, bagli = false, kimlik = 1, beklenen = new Map(), olaylar = new Map();
  const durumlar = new Map();
  let pipelineId = '', sohbetId = null, yukGecmisi = 0.3, ses = null, analiz = null, sesVeri = null;

  const haUrl = () => (params.get('ha') || ayar.ha_url || location.origin).replace(/\/$/, '');
  const st = id => durumlar.get(id);

  async function jeton(){
    const elle = localStorage.getItem('jarvis_token');
    if (elle) return elle;
    // Home Assistant arayüzünde oturum açılmış bu tarayıcıda (aynı adres) oturumu kullan
    try {
      const t = JSON.parse(localStorage.getItem('hassTokens') || 'null');
      if (!t) return null;
      if (Date.now() < t.expires - 60000) return t.access_token;
      const r = await fetch(haUrl() + '/auth/token', { method:'POST',
        body: new URLSearchParams({ grant_type:'refresh_token', client_id:t.clientId, refresh_token:t.refresh_token }) });
      if (!r.ok) return null;
      const y = await r.json(); t.access_token = y.access_token; t.expires = Date.now() + y.expires_in*1000;
      localStorage.setItem('hassTokens', JSON.stringify(t)); return y.access_token;
    } catch { return null; }
  }

  function gonder(msg){ const id = kimlik++; msg.id = id; ws.send(JSON.stringify(msg));
    return new Promise((ok, hata) => beklenen.set(id, { ok, hata })); }
  function abone(msg, isle){ const id = kimlik++; msg.id = id; olaylar.set(id, isle); ws.send(JSON.stringify(msg));
    return new Promise((ok, hata) => beklenen.set(id, { ok, hata })); }

  let deneme = 0;
  async function baglan(){
    const tk = await jeton();
    if (!tk) { kurulumGoster(); return; }
    const url = haUrl().replace(/^http/, 'ws') + '/api/websocket';
    ws = new WebSocket(url);
    ws.onmessage = async e => {
      const m = JSON.parse(e.data);
      if (m.type === 'auth_required') ws.send(JSON.stringify({ type:'auth', access_token: tk }));
      else if (m.type === 'auth_invalid') { localStorage.removeItem('jarvis_token'); kurulumGoster('Jeton geçersiz, yeniden girin.'); ws.close(); }
      else if (m.type === 'auth_ok') { bagli = true; deneme = 0; tanitim = false; durum = 'bekliyor'; await basla(); }
      else if (m.type === 'result') { const b = beklenen.get(m.id); if (b){ beklenen.delete(m.id); m.success ? b.ok(m.result) : b.hata(m.error); } }
      else if (m.type === 'event') { const f = olaylar.get(m.id); if (f) f(m.event); }
    };
    ws.onclose = () => { bagli = false; olaylar.clear(); beklenen.clear();
      if (document.getElementById('kurulum').style.display !== 'block') setTimeout(baglan, Math.min(30000, 1000 * 2 ** deneme++)); };
  }

  async function basla(){
    (await gonder({ type:'get_states' })).forEach(s => durumlar.set(s.entity_id, s));
    await abone({ type:'subscribe_events', event_type:'state_changed' }, ev => {
      const { entity_id, new_state, old_state } = ev.data;
      if (new_state) durumlar.set(entity_id, new_state); else durumlar.delete(entity_id);
      if (entity_id === uydu() && new_state) uyduDegisti(new_state.state, old_state && old_state.state);
    });
    try { const p = await gonder({ type:'assist_pipeline/pipeline/list' }); pipelineId = ayar.pipeline || p.preferred_pipeline || ''; } catch {}
    const u = st(uydu()); if (u) uyduDegisti(u.state);
  }

  // ses uydusu: ayarlar.json'daki ya da bulunan ilk assist_satellite varlığı
  const uydu = () => ayar.uydu || [...durumlar.keys()].find(k => k.startsWith('assist_satellite.')) || '';

  async function sonCalisma(){
    if (!pipelineId) return null;
    try {
      const l = await gonder({ type:'assist_pipeline/pipeline_debug/list', pipeline_id: pipelineId });
      const son = l.pipeline_runs[l.pipeline_runs.length - 1]; if (!son) return null;
      const d = await gonder({ type:'assist_pipeline/pipeline_debug/get', pipeline_id: pipelineId, pipeline_run_id: son.pipeline_run_id });
      const bul = tip => (d.events || []).filter(e => e.type === tip).pop();
      const stt = bul('stt-end'), ie = bul('intent-end');
      return { duyulan: stt && stt.data.stt_output && stt.data.stt_output.text,
               cevap: ie && ie.data.intent_output && ie.data.intent_output.response.speech.plain.speech };
    } catch { return null; }
  }

  async function uyduDegisti(yeni, eski){
    if (yeni === 'listening') { durum = 'dinliyor'; duyulan = ''; }
    else if (yeni === 'processing') { durum = 'dusunuyor'; const c = await sonCalisma(); if (c && c.duyulan) duyulan = c.duyulan; }
    else if (yeni === 'responding') {
      const c = await sonCalisma();
      if (c && c.duyulan) duyulan = c.duyulan;
      window.jarvisSoyle(c && c.cevap ? c.cevap : '…', null);   // uydu konuşmayı bitirince 'idle' gelir
    }
    else if (yeni === 'idle' && !ses) { if (durum === 'konusuyor') { konusmaBitis = zaman() + 0.8; } else { durum = 'bekliyor'; duyulan = ''; } }
  }

  /* ---- tabletten yazarak sorma: Assist hattı (metin → cevap → ses) ---- */
  async function sor(metin, sonAsama = 'tts'){
    if (!bagli) { duyulan = metin; window.jarvisSoyle('Home Assistant bağlantısı yok. Tanıtım modundayım.'); return; }
    duyulan = metin; durum = 'dusunuyor';
    let cevap = '';
    const istek = { type:'assist_pipeline/run', start_stage:'intent', end_stage: sonAsama, input:{ text: metin } };
    if (pipelineId) istek.pipeline = pipelineId;
    if (sohbetId) istek.conversation_id = sohbetId;
    try {
      await abone(istek, ev => {
        if (ev.type === 'intent-end') {
          const o = ev.data.intent_output; cevap = o.response.speech.plain.speech; sohbetId = o.conversation_id || sohbetId;
        } else if (ev.type === 'tts-end') {
          const u = ev.data.tts_output && (ev.data.tts_output.url || ev.data.tts_output.media_id);
          sesliOku(cevap, u && u.startsWith('/') ? haUrl() + u : u);
        } else if (ev.type === 'error') {
          if (cevap) window.jarvisSoyle(cevap); else window.jarvisSoyle('Bir sorun oluştu: ' + ev.data.message);
        } else if (ev.type === 'run-end' && cevap && durum !== 'konusuyor') window.jarvisSoyle(cevap);
      });
    } catch (e) {
      // Ses hattında yazıdan sese (TTS) yoksa sessiz, yalnızca yazılı cevap ver
      // (HA bu durumda yalnızca "Unknown error" döndürüyor, bu yüzden her hatada bir kez sessiz dener)
      if (sonAsama === 'tts') return sor(metin, 'intent');
      window.jarvisSoyle('Bir sorun oluştu: ' + ((e && (e.message || e.code)) || 'bilinmeyen hata'));
    }
  }

  function sesliOku(metin, url){
    if (!url) { window.jarvisSoyle(metin); return; }
    ses = new Audio(url); ses.crossOrigin = 'anonymous';
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const kaynak = ctx.createMediaElementSource(ses); analiz = ctx.createAnalyser(); analiz.fftSize = 512;
      kaynak.connect(analiz); analiz.connect(ctx.destination); sesVeri = new Uint8Array(analiz.fftSize);
    } catch { analiz = null; }
    ses.onloadedmetadata = () => { if (isFinite(ses.duration) && ses.duration > 0.5) HIZ = Math.max(8, Math.min(22, metin.length / (ses.duration - 0.3))); };
    ses.onplay = () => window.jarvisSoyle(metin, null);
    ses.onended = ses.onerror = () => { konusmaBitis = zaman() + 0.4; HIZ = HIZ_VARSAYILAN; ses = null; analiz = null; sesSeviyesi = 0; };
    ses.play().catch(() => { ses = null; window.jarvisSoyle(metin); });
  }

  function sesOlc(){
    if (!analiz) return 0;
    analiz.getByteTimeDomainData(sesVeri);
    let t = 0; for (const v of sesVeri) { const x = (v - 128) / 128; t += x*x; }
    return Math.min(1, Math.sqrt(t / sesVeri.length) * 4);
  }

  /* ---- paneller (ayarlar.json) ---- */
  function deger(satir){
    const s = st(satir.varlik);
    if (!s || s.state === 'unavailable' || s.state === 'unknown') return ['—'];
    if (satir.durumlar && satir.durumlar[s.state]) { const d = satir.durumlar[s.state]; return Array.isArray(d) ? d : [d]; }
    const n = parseFloat(s.state);
    if (!isNaN(n) && /^-?[\d.]+$/.test(s.state)) {
      const b = satir.birim ?? s.attributes.unit_of_measurement ?? '';
      return [n.toLocaleString('tr-TR', { maximumFractionDigits: satir.ondalik ?? 1 }) + (b ? (b === '%' ? '%' : ' ' + b) : '')];
    }
    return [String(s.state).toLocaleUpperCase('tr-TR')];
  }
  function sistem(){
    const u = st(uydu());
    return { baslik:'SİSTEM DURUMU', satirlar:[
      ['HOME ASSISTANT', 'BAĞLI', YESIL],
      ['SES UYDUSU', u ? (u.state === 'unavailable' ? 'ÇEVRİMDIŞI' : 'HAZIR') : 'YOK', u && u.state !== 'unavailable' ? YESIL : SARI],
      ['ZIGBEE AĞI', zigbee()],
      ['CİHAZ SAYISI', String(durumlar.size)],
    ]};
  }
  const zigbee = () => { const n = [...durumlar.values()].filter(s => s.attributes && s.attributes.device_class && s.entity_id.startsWith('binary_sensor.')).length; return n ? n + ' SENSÖR' : '—'; };
  function paneller(taraf){
    if (!bagli) return taraf === 'sol' ? DEMO_SOL : DEMO_SAG;
    const liste = (ayar.paneller && ayar.paneller[taraf]) || [];
    const sonuc = liste.map(p => ({ baslik: p.baslik, satirlar: p.satirlar.map(r => [r.ad, ...deger(r)]) }));
    return taraf === 'sol' ? [sistem(), ...sonuc] : sonuc;
  }
  function hava(){
    if (!bagli) return '12°C  BULUTLU';
    const id = ayar.hava || [...durumlar.keys()].find(k => k.startsWith('weather.'));
    const s = id && st(id); if (!s) return '—';
    const tmp = s.attributes.temperature;
    return (tmp !== undefined ? Math.round(tmp) + '°C  ' : '') + (HAVA_TR[s.state] || s.state.toUpperCase());
  }
  function yuk(t){
    if (!bagli) return 0.35+0.25*Math.sin(t*1.3)+0.15*Math.sin(t*4.1);
    const s = ayar.yuk_sensoru && st(ayar.yuk_sensoru);
    const v = s ? parseFloat(s.state)/100 : NaN;
    if (!isNaN(v)) yukGecmisi += (v - yukGecmisi) * 0.05;
    return yukGecmisi;
  }

  /* ---- kurulum penceresi ve yazma kutusu ---- */
  function kurulumGoster(mesaj){
    if (params.get('demo')) return;
    const k = document.getElementById('kurulum'); k.style.display = 'block';
    if (mesaj) k.querySelector('p').insertAdjacentHTML('afterbegin', `<b style="color:#ff6b6b">${mesaj}</b><br>`);
  }
  document.getElementById('jetonKaydet').onclick = () => {
    const v = document.getElementById('jetonGiris').value.trim(); if (!v) return;
    localStorage.setItem('jarvis_token', v); document.getElementById('kurulum').style.display = 'none'; baglan();
  };
  document.getElementById('tanitimDevam').onclick = () => { document.getElementById('kurulum').style.display = 'none'; };
  const kutu = document.getElementById('sor'), giris = document.getElementById('sorGiris');
  const ac = () => { if (document.getElementById('kurulum').style.display === 'block') return; kutu.style.display = 'block'; giris.focus(); };
  addEventListener('pointerdown', e => { if (!e.target.closest('.kutu')) ac(); });
  addEventListener('keydown', e => {
    if (e.target === giris) {
      if (e.key === 'Enter' && giris.value.trim()) { sor(giris.value.trim()); giris.value = ''; kutu.style.display = 'none'; }
      else if (e.key === 'Escape') kutu.style.display = 'none';
    } else if (e.key.length === 1 && !e.target.closest('.kutu')) ac();
  });

  async function baslat(){
    try { ayar = await (await fetch('ayarlar.json', { cache:'no-store' })).json(); } catch { ayar = {}; }
    if (params.get('demo') || params.get('durum') || window.__kare !== undefined) return;
    baglan();
  }
  baslat();
  return { paneller, hava, yuk, sesOlc, sor, bagliMi: () => bagli };
})();
window.jarvisSor = m => HA.sor(m);
window.__jarvis = () => ({ durum, altyazi, duyulan, bagli: HA.bagliMi(), tanitim });   // tanılama

/* ---------------- HUD (2B katman) ---------------- */
const hud = document.getElementById('hud'), h = hud.getContext('2d');
let W=0, H=0, D=1;
function boyut(){
  D = Math.min(devicePixelRatio, 2); W = innerWidth; H = innerHeight;
  renderer.setSize(W, H, false); composer.setSize(W, H); bloom.setSize(W*D, H*D);
  camera.aspect = W/H; camera.updateProjectionMatrix();
  hud.width = W*D; hud.height = H*D; h.setTransform(D,0,0,D,0,0);
}
addEventListener('resize', boyut); boyut();

const MONO = '"JetBrains Mono", "DejaVu Sans Mono", monospace';
const SANS = 'Inter, "DejaVu Sans", sans-serif';
const cyan = a => `rgba(53,212,255,${a})`;
const spektrum = new Array(48).fill(0);
const grafik = new Array(60).fill(0).map((_,i)=>0.4+0.3*Math.sin(i/5));

function yay(x,y,r,a0,a1,lw,renk){ h.beginPath(); h.arc(x,y,r,a0,a1); h.lineWidth=lw; h.strokeStyle=renk; h.stroke(); }
function kose(x,y,w,hh,l){ h.beginPath();
  h.moveTo(x,y+l); h.lineTo(x,y); h.lineTo(x+l,y); h.moveTo(x+w-l,y); h.lineTo(x+w,y); h.lineTo(x+w,y+l);
  h.moveTo(x+w,y+hh-l); h.lineTo(x+w,y+hh); h.lineTo(x+w-l,y+hh); h.moveTo(x+l,y+hh); h.lineTo(x,y+hh); h.lineTo(x,y+hh-l); h.stroke(); }
function panel(x,y,w,baslik,satirlar){
  h.strokeStyle=cyan(0.45); h.lineWidth=1; kose(x,y,w,22+satirlar.length*19,8);
  h.fillStyle=cyan(0.06); h.fillRect(x,y,w,20);
  h.font=`600 10px ${MONO}`; h.fillStyle=cyan(0.9); h.textAlign='left'; h.fillText(baslik, x+8, y+14);
  satirlar.forEach(([k,v,renk],i)=>{ h.fillStyle=cyan(0.55); h.fillText(k, x+8, y+38+i*19);
    h.textAlign='right'; h.fillStyle=renk||'rgba(220,245,255,0.92)'; h.fillText(v, x+w-8, y+38+i*19); h.textAlign='left'; });
}

function hudCiz(t, ses){
  h.clearRect(0,0,W,H);
  const cx = W/2, cy = H*0.47, R = Math.min(W,H)*0.36;
  const hz = durum==='dusunuyor' ? 2.6 : 1;

  // merkez halkaları
  yay(cx,cy,R,0,Math.PI*2,1,cyan(0.12));
  for (let i=0;i<3;i++){ const b=t*0.35*hz+i*2.094; yay(cx,cy,R,b,b+0.55,2,cyan(0.7)); }
  yay(cx,cy,R*1.06,0,Math.PI*2,1,cyan(0.06));
  for (let i=0;i<6;i++){ const b=-t*0.18*hz+i*Math.PI/3; yay(cx,cy,R*1.06,b,b+0.22,3,'rgba(165,139,255,0.55)'); }
  // ölçek
  h.save(); h.translate(cx,cy); h.rotate(t*0.04);
  for (let i=0;i<180;i++){ const a=i/180*Math.PI*2, uzun=i%15===0; h.strokeStyle=cyan(uzun?0.6:0.18); h.lineWidth=1;
    h.beginPath(); h.moveTo(Math.cos(a)*R*1.12, Math.sin(a)*R*1.12); h.lineTo(Math.cos(a)*(R*1.12+(uzun?12:5)), Math.sin(a)*(R*1.12+(uzun?12:5))); h.stroke(); }
  h.restore();
  // ses halkası
  h.beginPath();
  for (let i=0;i<=240;i++){ const a=i/240*Math.PI*2;
    const r = R*0.93 + (Math.sin(a*9+t*7)*0.55+Math.sin(a*17-t*11)*0.45)*R*0.035*ses;
    i ? h.lineTo(cx+Math.cos(a)*r, cy+Math.sin(a)*r) : h.moveTo(cx+Math.cos(a)*r, cy+Math.sin(a)*r); }
  h.closePath(); h.strokeStyle=cyan(0.2+0.6*ses); h.lineWidth=1.5; h.shadowColor=cyan(1); h.shadowBlur=10; h.stroke(); h.shadowBlur=0;
  // hedef işaretleri
  h.strokeStyle=cyan(0.5); h.lineWidth=1;
  [[0,-1],[0,1],[-1,0],[1,0]].forEach(([dx,dy])=>{ h.beginPath(); h.moveTo(cx+dx*R*1.2, cy+dy*R*1.2); h.lineTo(cx+dx*R*1.3, cy+dy*R*1.3); h.stroke(); });

  // sol panel
  const pw = Math.min(250, W*0.2), sx = 28;
  { let y = 70; for (const p of HA.paneller('sol')) { panel(sx, y, pw, p.baslik, p.satirlar); y += 22 + p.satirlar.length*19 + 26; } }
  // sağ panel
  const rx = W - pw - 28;
  const tarih = window.__kare !== undefined ? new Date(Date.UTC(2026,10,26,18,41,0) + t*1000) : new Date();
  const saat = tarih.toLocaleTimeString('tr-TR', {timeZone:'Europe/Istanbul'});
  const gun = tarih.toLocaleDateString('tr-TR', {timeZone:'Europe/Istanbul'});
  let y = 70;
  panel(rx, y, pw, 'ZAMAN', [['SAAT', saat], ['TARİH', gun], ['DIŞARISI', HA.hava()]]); y += 22 + 3*19 + 26;
  for (const p of HA.paneller('sag')) { panel(rx, y, pw, p.baslik, p.satirlar); y += 22 + p.satirlar.length*19 + 26; }
  // yük grafiği
  grafik.push(HA.yuk(t)); grafik.shift();
  const gy = y, gh = 50; h.strokeStyle=cyan(0.45); kose(rx, gy, pw, gh+20, 8);
  h.font=`600 10px ${MONO}`; h.fillStyle=cyan(0.9); h.textAlign='left'; h.fillText('İŞLEM YÜKÜ', rx+8, gy+14);
  h.beginPath(); grafik.forEach((v,i)=>{ const x=rx+8+i*(pw-16)/59, y=gy+gh+14-v*gh*0.8; i?h.lineTo(x,y):h.moveTo(x,y); });
  h.strokeStyle=cyan(0.85); h.lineWidth=1.2; h.stroke();

  // alt spektrum
  for (let i=0;i<spektrum.length;i++){
    const hedef = ses * (0.3 + 0.7*Math.abs(Math.sin(t*9 + i*0.7) * Math.sin(t*3.3 + i*0.23)));
    spektrum[i] += (hedef - spektrum[i]) * 0.35; }
  const bw = Math.min(520, W*0.42), bx = cx - bw/2, by = H*0.88;
  spektrum.forEach((v,i)=>{ const x = bx + i*bw/spektrum.length, hh = 2 + v*34;
    h.fillStyle = cyan(0.25+0.6*v); h.fillRect(x, by-hh, bw/spektrum.length-2, hh); h.fillRect(x, by+3, bw/spektrum.length-2, hh*0.35); });

  // başlık ve durum
  h.textAlign='center';
  h.font=`700 ${Math.round(Math.min(W,H)*0.042)}px ${SANS}`; h.letterSpacing=`${Math.round(Math.min(W,H)*0.02)}px`;
  h.fillStyle='rgba(225,248,255,0.95)'; h.shadowColor=cyan(0.9); h.shadowBlur=16; h.fillText('JARVIS', cx+Math.round(Math.min(W,H)*0.01), 52);
  h.shadowBlur=0; h.letterSpacing='3px'; h.font=`600 12px ${MONO}`; h.fillStyle=DURUM_RENK[durum];
  const nokta = (Math.floor(t*2)%2===0 || durum==='bekliyor') ? '●' : '○';
  h.fillText(`${nokta}  ${ETIKET[durum]}`, cx, 74); h.letterSpacing='0px';
  // kullanıcının söylediği
  if (duyulan && (durum==='dusunuyor' || durum==='konusuyor')){
    h.font=`500 ${Math.round(Math.min(W,H)*0.019)}px ${SANS}`; h.fillStyle='rgba(61,220,151,0.85)';
    h.fillText('“' + duyulan + '”', cx, H*0.915);
  }
  // altyazı
  if (altyazi && durum==='konusuyor'){
    const n = Math.min(altyazi.length, Math.floor((t-altyaziBas)*HIZ) + 1);
    h.font=`500 ${Math.round(Math.min(W,H)*0.026)}px ${SANS}`; h.fillStyle='rgba(230,244,252,0.95)';
    h.fillText(altyazi.slice(0,n) + (n<altyazi.length?'▍':''), cx, H*0.955);
  }
  // çerçeve köşeleri ve tarama çizgileri
  h.strokeStyle=cyan(0.35); h.lineWidth=1.5; kose(14,14,W-28,H-28,46);
  h.fillStyle='rgba(0,0,0,0.10)'; for (let y=0;y<H;y+=3) h.fillRect(0,y,W,1);
}

/* ---------------- döngü ---------------- */
let cene = 0, genis = 0, yuvarlak = 0, gulum = 0, kas = 0, ses = 0, parlak = 0.6, yaw = 0, pitch = 0, kirpma = 1, bozulma = 0;
let oncekiDurum = '';
function kare(){
  const t = zaman();
  sesSeviyesi = HA.sesOlc();
  if (tanitim){
    let k = t % SENARYO_SURE, i = 0; while (k > SENARYO[i][1]) { k -= SENARYO[i][1]; i++; }
    const [d,,m] = SENARYO[i];
    if (d !== durum || (m && altyazi !== m)) { durum = d; if (m){ altyazi = m; altyaziBas = t - k; } }
  } else if (durum==='konusuyor' && konusmaBitis && t > konusmaBitis) { durum = 'bekliyor'; duyulan = ''; }
  if (durum !== oncekiDurum){ bozulma = 1; oncekiDurum = durum; }

  let ceneH = 0.02, genisH = 0, yuvarlakH = 0, gulumH = 0.12, kasH = 0, sesH = 0.05;
  if (durum==='konusuyor'){
    const gecen = t - altyaziBas, bitti = gecen*HIZ >= altyazi.length;
    const [c, g, y] = bitti ? SESSIZLIK : viseme(altyazi, gecen);
    ceneH = c; genisH = g; yuvarlakH = y;
    if (sesSeviyesi > 0) ceneH = Math.min(1, ceneH * (0.35 + 1.4*sesSeviyesi));   // gerçek ses çalıyorsa şiddete göre
    gulumH = bitti ? 0.45 : 0.10;                           // cümle bitince hafif gülümser
    kasH = 0.15 + 0.15*Math.max(0, Math.sin(gecen*1.7));    // konuşurken kaşlar canlı
    sesH = bitti ? 0.05 : 0.35 + 0.65*c;
  }
  else if (durum==='dinliyor'){ kasH = 0.45; gulumH = 0.15; sesH = 0.25 + 0.25*Math.abs(Math.sin(t*4.3)*Math.sin(t*1.7)); }
  else if (durum==='dusunuyor'){ kasH = -0.35; gulumH = 0; yuvarlakH = 0.15; sesH = 0.15; }
  const yum = (a, b, k) => a + (b - a) * k;
  cene = yum(cene, ceneH, 0.5); genis = yum(genis, genisH, 0.45); yuvarlak = yum(yuvarlak, yuvarlakH, 0.45);
  gulum = yum(gulum, gulumH, 0.12); kas = yum(kas, kasH, 0.15); ses = yum(ses, sesH, 0.3);
  const parlakH = {bekliyor:0.6, dinliyor:0.95, dusunuyor:0.8, konusuyor:1.0}[durum];
  parlak += (parlakH-parlak)*0.06;
  bozulma *= 0.9;

  // baş hareketi: beklerken yavaş bakınma, dinlerken kameraya döner, düşünürken hafif yukarı
  const yawH = durum==='dinliyor' ? 0.05*Math.sin(t*0.8) : durum==='konusuyor' ? 0.12*Math.sin(t*0.6) : 0.32*Math.sin(t*0.27);
  const pitchH = durum==='dusunuyor' ? -0.12 : 0.04*Math.sin(t*0.5) + (durum==='konusuyor'? 0.03*Math.sin(t*2.3):0);
  yaw += (yawH-yaw)*0.04; pitch += (pitchH-pitch)*0.05;
  kafa.rotation.set(pitch, yaw, durum==='dinliyor'? 0.04 : 0);
  kafa.position.y = 0.12*Math.sin(t*0.6);

  // göz kırpma (her ~4 sn)
  const kp = (t % 4.2); kirpma = kp < 0.14 ? Math.abs(Math.cos(kp/0.14*Math.PI)) * 0.9 + 0.1 : 1;
  const gp = (durum==='dinliyor'?1.15:durum==='konusuyor'?1.0:0.8) * parlak;
  gozler.forEach(g => { g.scale.set(0.55*gp, 0.55*gp*kirpma, 1); g.material.opacity = Math.min(1, gp); });

  ortak.uZaman.value = t; ortak.uCene.value = cene; ortak.uParlak.value = parlak;
  if (window.__mimik) ({cene, genis, yuvarlak, gulum, kas} = Object.assign({cene, genis, yuvarlak, gulum, kas}, window.__mimik));  // test için
  ortak.uCene.value = cene; ortak.uGenis.value = genis; ortak.uYuvarlak.value = yuvarlak; ortak.uGulum.value = gulum; ortak.uKas.value = kas;
  ortak.uTarama.value = 4.2 - ((t*0.9) % 9.5); ortak.uBozulma.value = bozulma;
  const toz = scene.getObjectByName('toz'); toz.rotation.y = t*0.02;
  bloom.strength = 0.55 + 0.45*parlak;

  composer.render();
  hudCiz(t, ses);
}
window.__ciz = kare;                       // kayıt aracı için
renderer.setAnimationLoop(() => { if (window.__kare === undefined) kare(); });
