# =====================================================================
#  Ev Jarvis'i – ESP32-S3 ses uydusu ("Hey Jarvis")
#  Donanım: ESP32-S3 N16R8 DevKitC-1 + INMP441 mikrofon + MAX98357A amfi + hoparlör
#  Bağlantı şeması: esphome/BAGLANTI.md
#
#  Home Assistant → ESPHome Device Builder → + New Device → (atla) →
#  oluşan dosyanın içeriğini bununla değiştir, sadece "substitutions" kısmını düzenle,
#  ardından Install → "Plug into this computer" (ilk sefer USB ile).
#  Birden fazla oda için dosyayı kopyala, sadece "name" ve "friendly_name" değiştir.
# =====================================================================

substitutions:
  name: jarvis-salon
  friendly_name: Jarvis Salon
  # Kartın üzerindeki RGB LED: çoğu N16R8 kartta GPIO48, bazı v1.1 kartlarda GPIO38
  led_pin: GPIO48

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2025.5.0
  name_add_mac_suffix: false
  on_boot:
    priority: -100
    then:
      - light.turn_on:
          id: durum_led
          brightness: 30%
          red: 100%
          green: 50%
          blue: 0%

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  cpu_frequency: 240MHZ
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"

psram:
  mode: octal
  speed: 80MHz

logger:

api:
  on_client_connected:
    - micro_wake_word.start:
    - light.turn_off: durum_led
  on_client_disconnected:
    - voice_assistant.stop:
    - micro_wake_word.stop:
    - light.turn_on:
        id: durum_led
        brightness: 30%
        red: 100%
        green: 0%
        blue: 0%

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Kurulum"

captive_portal:

# ---------------------------------------------------------------------
# Ses donanımı
# ---------------------------------------------------------------------
i2s_audio:
  - id: i2s_mikrofon
    i2s_lrclk_pin: GPIO4    # INMP441 WS
    i2s_bclk_pin: GPIO5     # INMP441 SCK
  - id: i2s_hoparlor
    i2s_lrclk_pin: GPIO16   # MAX98357A LRC
    i2s_bclk_pin: GPIO15    # MAX98357A BCLK

microphone:
  - platform: i2s_audio
    id: mikrofon
    i2s_audio_id: i2s_mikrofon
    i2s_din_pin: GPIO6      # INMP441 SD
    adc_type: external
    pdm: false
    channel: left           # INMP441 L/R pini GND'ye bağlı
    bits_per_sample: 32bit
    sample_rate: 16000

speaker:
  - platform: i2s_audio
    id: hoparlor
    i2s_audio_id: i2s_hoparlor
    i2s_dout_pin: GPIO7     # MAX98357A DIN
    dac_type: external
    channel: mono
    sample_rate: 16000
    bits_per_sample: 16bit

# ---------------------------------------------------------------------
# Uyandırma kelimesi: "Hey Jarvis" (cihazın üzerinde, internetsiz çalışır)
# ---------------------------------------------------------------------
micro_wake_word:
  id: uyandirma
  microphone: mikrofon
  models:
    - model: hey_jarvis
  on_wake_word_detected:
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

# ---------------------------------------------------------------------
# Sesli asistan (Home Assistant Assist hattı: Whisper → Jarvis → Piper)
# ---------------------------------------------------------------------
voice_assistant:
  id: asistan
  microphone: mikrofon
  speaker: hoparlor
  micro_wake_word: uyandirma
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  on_listening:
    - light.turn_on:
        id: durum_led
        brightness: 60%
        red: 0%
        green: 40%
        blue: 100%
        effect: none
  on_stt_vad_end:
    - light.turn_on:
        id: durum_led
        brightness: 60%
        red: 60%
        green: 0%
        blue: 100%
        effect: Nabız
  on_tts_start:
    - light.turn_on:
        id: durum_led
        brightness: 60%
        red: 0%
        green: 100%
        blue: 40%
        effect: none
  on_end:
    - wait_until:
        not:
          voice_assistant.is_running:
    - light.turn_off: durum_led
    - micro_wake_word.start:
  on_error:
    - light.turn_on:
        id: durum_led
        brightness: 60%
        red: 100%
        green: 0%
        blue: 0%
        effect: none
    - delay: 2s
    - light.turn_off: durum_led

# ---------------------------------------------------------------------
# Durum ışığı ve kontroller
# ---------------------------------------------------------------------
light:
  - platform: esp32_rmt_led_strip
    id: durum_led
    name: Durum ışığı
    pin: ${led_pin}
    num_leds: 1
    channel_colors: GRB
    chipset: WS2812
    default_transition_length: 0s
    effects:
      - pulse:
          name: Nabız
          transition_length: 400ms
          update_interval: 400ms

switch:
  - platform: template
    id: mikrofon_kapali
    name: Mikrofonu kapat (gizlilik)
    icon: mdi:microphone-off
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - voice_assistant.stop:
      - micro_wake_word.stop:
      - light.turn_on:
          id: durum_led
          brightness: 15%
          red: 100%
          green: 0%
          blue: 0%
    on_turn_off:
      - micro_wake_word.start:
      - light.turn_off: durum_led

button:
  - platform: restart
    name: Yeniden başlat
