<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jarvis – holografik yüz</title>
<style>
  html,body{margin:0;height:100%;background:#02060b;overflow:hidden;font-family:Inter,system-ui,sans-serif}
  canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* =====================================================================
   Ev Jarvis'i – holografik yüz animasyonu
   Durumlar: bekliyor | dinliyor | dusunuyor | konusuyor
   - Adres çubuğuna ?durum=konusuyor yazarak sabitlenebilir.
   - Parametre yoksa tanıtım modunda durumlar sırayla döner.
   - Home Assistant'tan kontrol için: window.jarvisDurum('dinliyor')
     ve window.jarvisSoyle('metin') (altyazı + konuşma animasyonu).
   ===================================================================== */
const cv = document.getElementById('c'), cx = cv.getContext('2d');
let W, H, DPR;
function boyut(){ DPR = Math.min(window.devicePixelRatio||1, 2); W = cv.width = innerWidth*DPR; H = cv.height = innerHeight*DPR; }
addEventListener('resize', boyut); boyut();

const RENK = { ana:[56,214,245], ikinci:[124,92,255], sicak:[255,181,71] };
const rgba = (c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;

/* ---------- Yüz modeli: parametrik baş + yüz hatları ---------- */
const ENLEM = 34, BOYLAM = 44;
function g(x,y,sx,sy){ return Math.exp(-(x*x)/(2*sx*sx)-(y*y)/(2*sy*sy)); }
function bas(u, v, cene){              // u: -1..1 (yukarı-aşağı), v: açı
  const y = u;                          // u>0 aşağı (çene), ekranda y aşağı artar
  let r = Math.sqrt(Math.max(0, 1 - u*u));
  // çene daralır, alın geniş
  let sx = 0.80 * (u > 0.35 ? 1 - (u-0.35)*0.40 : 1);   // çene hattı
  let sz = 0.86;
  let x = Math.sin(v) * r * sx;
  let z = Math.cos(v) * r * sz;
  const on = Math.max(0, Math.cos(v));  // yüzün önü
  // burun
  z += 0.26 * g(x, u-0.08, 0.07, 0.16) * on;
  // kaş çıkıntısı
  z += 0.06 * g(Math.abs(x)-0.24, u+0.30, 0.16, 0.05) * on;
  // göz çukurları
  z -= 0.09 * g(Math.abs(x)-0.25, u+0.18, 0.09, 0.06) * on;
  // elmacık kemikleri
  z += 0.05 * g(Math.abs(x)-0.38, u-0.05, 0.10, 0.10) * on;
  // dudaklar
  z += 0.05 * g(x, u-0.40, 0.14, 0.05) * on;
  // ağız açıklığı: alt dudak ve çene aşağı iner
  let yy = y;
  if (u > 0.40) yy += cene * 0.10 * g(x, 0, 0.30, 1) * Math.min(1,(u-0.40)*6) * on;
  return [x*1.0, yy*1.06, z];
}

/* ---------- Durum yönetimi ---------- */
const params = new URLSearchParams(location.search);
let durum = params.get('durum') || 'bekliyor';
const tanitim = !params.get('durum');
let altyazi = '', altyaziT = 0, konusmaBitis = 0;
window.jarvisDurum = d => { durum = d; };
window.jarvisSoyle = (metin) => { altyazi = metin; altyaziT = performance.now(); durum='konusuyor';
  konusmaBitis = performance.now() + Math.max(2500, metin.length*65); };
const SENARYO = [
  ['bekliyor', 3200, ''],
  ['dinliyor', 2600, ''],
  ['dusunuyor', 1800, ''],
  ['konusuyor', 4200, 'İyi akşamlar efendim. Salon 22 derece, tüm sistemler normal çalışıyor.'],
  ['bekliyor', 1500, ''],
  ['dinliyor', 2200, ''],
  ['dusunuyor', 1400, ''],
  ['konusuyor', 3800, 'Bilgisayarınızı açtım. Kapıda kimse yok, alarm devrede.'],
];
let sIdx = 0, sZaman = performance.now();
const ETIKET = { bekliyor:'BEKLEMEDE', dinliyor:'DİNLİYORUM', dusunuyor:'DÜŞÜNÜYORUM', konusuyor:'KONUŞUYOR' };

/* ---------- Parçacıklar ---------- */
const PAR = Array.from({length:140},()=>({a:Math.random()*Math.PI*2, r:0.55+Math.random()*0.75, h:(Math.random()-.5)*1.6, s:0.0006+Math.random()*0.0018, b:Math.random()}));

let cene = 0, ceneHedef = 0, ses = 0, t0 = performance.now();
let isik = 0.6;   // genel parlaklık (durumla değişir)

function ciz(now){
  const t = (now - t0)/1000;
  // tanıtım senaryosu
  if (tanitim){
    const [d, sure, metin] = SENARYO[sIdx];
    if (durum !== d || (d==='konusuyor' && altyazi!==metin && now-sZaman<50)) { durum = d; if (metin){ altyazi = metin; altyaziT = now; } }
    if (now - sZaman > sure){ sIdx = (sIdx+1)%SENARYO.length; sZaman = now; }
  } else if (durum==='konusuyor' && konusmaBitis && now>konusmaBitis){ durum='bekliyor'; }

  // konuşma: hece ritminde çene hareketi
  if (durum==='konusuyor'){
    const hece = Math.max(0, Math.sin(t*13.0)*0.6 + Math.sin(t*7.3+1)*0.4);
    ceneHedef = 0.25 + hece*0.75 * (0.6+0.4*Math.sin(t*2.1));
    ses = 0.5 + 0.5*hece;
  } else if (durum==='dinliyor'){ ceneHedef = 0.08; ses = 0.25+0.2*Math.abs(Math.sin(t*5)); }
  else { ceneHedef = 0.04; ses *= 0.92; }
  cene += (ceneHedef - cene)*0.35;
  const isikHedef = {bekliyor:0.55, dinliyor:0.9, dusunuyor:0.75, konusuyor:1}[durum];
  isik += (isikHedef - isik)*0.05;

  cx.setTransform(1,0,0,1,0,0);
  // arka plan
  const bg = cx.createRadialGradient(W/2,H*0.46,0,W/2,H*0.46,Math.max(W,H)*0.7);
  bg.addColorStop(0,'#071a26'); bg.addColorStop(0.5,'#040c14'); bg.addColorStop(1,'#010307');
  cx.fillStyle = bg; cx.fillRect(0,0,W,H);
  // ızgara zemin
  cx.save(); cx.strokeStyle = rgba(RENK.ana,0.05); cx.lineWidth = DPR;
  const ad = 40*DPR; for(let x=(t*8*DPR)%ad; x<W; x+=ad){ cx.beginPath(); cx.moveTo(x,0); cx.lineTo(x,H); cx.stroke(); }
  for(let y=0; y<H; y+=ad){ cx.beginPath(); cx.moveTo(0,y); cx.lineTo(W,y); cx.stroke(); } cx.restore();

  const S = Math.min(W,H)*0.19, OX = W/2, OY = H*0.46;

  /* --- HUD halkaları --- */
  cx.save(); cx.translate(OX,OY);
  const halka = (r, kal, renk, a, bas, son, dash) => { cx.beginPath(); cx.strokeStyle = rgba(renk,a); cx.lineWidth = kal*DPR; cx.setLineDash(dash||[]); cx.arc(0,0,r,bas,son); cx.stroke(); cx.setLineDash([]); };
  const hz = durum==='dusunuyor'? 3 : 1;
  halka(S*1.55, 1, RENK.ana, 0.18*isik, 0, Math.PI*2);
  for (let i=0;i<3;i++){ const b = t*0.4*hz + i*2.1; halka(S*1.62, 3, RENK.ana, 0.55*isik, b, b+0.9); }
  for (let i=0;i<4;i++){ const b = -t*0.25*hz + i*Math.PI/2; halka(S*1.78, 1.5, RENK.ikinci, 0.45*isik, b, b+0.5); }
  halka(S*1.92, 1, RENK.ana, 0.25*isik, 0, Math.PI*2, [2*DPR, 9*DPR]);
  // ölçek çizgileri
  cx.rotate(t*0.05);
  for (let i=0;i<120;i++){ const a=i/120*Math.PI*2, uz = i%10===0? 14:6; cx.strokeStyle = rgba(RENK.ana, i%10===0?0.5*isik:0.2*isik); cx.lineWidth=DPR;
    cx.beginPath(); cx.moveTo(Math.cos(a)*S*2.02, Math.sin(a)*S*2.02); cx.lineTo(Math.cos(a)*(S*2.02+uz*DPR), Math.sin(a)*(S*2.02+uz*DPR)); cx.stroke(); }
  cx.restore();

  /* --- ses dalgası halkası --- */
  cx.save(); cx.translate(OX,OY); cx.beginPath();
  for (let i=0;i<=180;i++){ const a=i/180*Math.PI*2;
    const r = S*1.40 + (Math.sin(a*8+t*6)*0.5+Math.sin(a*13-t*9)*0.5)*S*0.06*ses;
    i? cx.lineTo(Math.cos(a)*r,Math.sin(a)*r) : cx.moveTo(Math.cos(a)*r,Math.sin(a)*r); }
  cx.closePath(); cx.strokeStyle = rgba(RENK.ana, 0.25+0.5*ses); cx.lineWidth=1.5*DPR; cx.shadowColor=rgba(RENK.ana,1); cx.shadowBlur=12*DPR; cx.stroke(); cx.restore();

  /* --- parçacıklar --- */
  for (const p of PAR){ p.a += p.s*(durum==='dusunuyor'?4:1); const x = OX + Math.cos(p.a)*p.r*S*2.1, y = OY + p.h*S*1.2 + Math.sin(p.a)*p.r*S*0.25;
    cx.fillStyle = rgba(p.b>0.8?RENK.ikinci:RENK.ana, (0.2+0.5*p.b)*isik); cx.fillRect(x,y,1.6*DPR,1.6*DPR); }

  /* --- yüz ağı --- */
  const yaw = Math.sin(t*0.45)*0.38 + (durum==='dinliyor'? Math.sin(t*1.3)*0.05:0);
  const pitch = Math.sin(t*0.33)*0.08 - 0.04 + (durum==='dusunuyor'? -0.08:0);
  const cy=Math.cos(yaw), sy=Math.sin(yaw), cp=Math.cos(pitch), sp=Math.sin(pitch);
  const P = [];
  for (let i=0;i<=ENLEM;i++){ const u = -0.98 + i/ENLEM*1.96; const sat=[];
    for (let j=0;j<=BOYLAM;j++){ const v = -Math.PI + j/BOYLAM*Math.PI*2;
      let [x,y,z] = bas(u,v,cene);
      let x1 = x*cy + z*sy, z1 = -x*sy + z*cy;          // yaw
      let y1 = y*cp - z1*sp, z2 = y*sp + z1*cp;          // pitch
      const k = 2.6/(2.6 - z2);                          // perspektif
      sat.push([OX + x1*S*k, OY + y1*S*k, z2]); }
    P.push(sat); }
  cx.save(); cx.lineWidth = 1*DPR; cx.globalCompositeOperation='lighter';
  const tarama = ((t*0.35)%1.4)-0.2;   // aşağı inen tarama çizgisi
  for (let i=0;i<=ENLEM;i++) for (let j=0;j<BOYLAM;j++){
    const a=P[i][j], b=P[i][j+1]; const z=(a[2]+b[2])/2; if (z< -0.15) continue;
    const iz = Math.abs(i/ENLEM - tarama) < 0.04 ? 0.6 : 0;
    cx.strokeStyle = rgba(RENK.ana, (0.08 + 0.45*Math.max(0,z) + iz)*isik);
    cx.beginPath(); cx.moveTo(a[0],a[1]); cx.lineTo(b[0],b[1]); cx.stroke(); }
  for (let j=0;j<=BOYLAM;j++) for (let i=0;i<ENLEM;i++){
    const a=P[i][j], b=P[i+1][j]; const z=(a[2]+b[2])/2; if (z< -0.15) continue;
    cx.strokeStyle = rgba(RENK.ana, (0.05 + 0.32*Math.max(0,z))*isik);
    cx.beginPath(); cx.moveTo(a[0],a[1]); cx.lineTo(b[0],b[1]); cx.stroke(); }
  // düğüm noktaları
  for (let i=0;i<=ENLEM;i+=2) for (let j=0;j<=BOYLAM;j+=2){ const p=P[i][j]; if (p[2]<0.15) continue;
    cx.fillStyle = rgba([190,245,255], 0.5*p[2]*isik); cx.fillRect(p[0]-DPR, p[1]-DPR, 2*DPR, 2*DPR); }
  cx.restore();

  /* --- gözler --- */
  const goz = (sx) => {   // gözün yüz yüzeyindeki konumu
    const u=-0.18, v=Math.asin(Math.max(-1,Math.min(1,(sx*0.25)/0.80/Math.sqrt(1-u*u))));
    let [x,y,z] = bas(u, v, 0); z += 0.02;
    let x1=x*cy+z*sy, z1=-x*sy+z*cy, y1=y*cp-z1*sp, z2=y*sp+z1*cp; const k=2.6/(2.6-z2);
    return [OX+x1*S*k, OY+y1*S*k, z2]; };
  const kirp = (Math.sin(t*0.9)>0.985) ? 0.15 : 1;  // ara sıra göz kırpma
  for (const sx of [-1,1]){ const [ex,ey,ez] = goz(sx); if (ez<0) continue;
    const parl = (durum==='dinliyor'?1:durum==='konusuyor'?0.9:0.7)*isik;
    const gr = cx.createRadialGradient(ex,ey,0,ex,ey,S*0.13); gr.addColorStop(0,rgba([220,252,255],0.95*parl)); gr.addColorStop(0.25,rgba(RENK.ana,0.6*parl)); gr.addColorStop(1,rgba(RENK.ana,0));
    cx.fillStyle=gr; cx.beginPath(); cx.ellipse(ex,ey,S*0.13,S*0.13*kirp,0,0,Math.PI*2); cx.fill();
    cx.fillStyle=rgba([235,253,255],parl); cx.beginPath(); cx.ellipse(ex,ey,S*0.035,S*0.022*kirp,0,0,Math.PI*2); cx.fill(); }

  /* --- ağız ışığı (konuşurken) --- */
  if (cene>0.1){ const u=0.44; let [x,y,z]=bas(u,0,cene); let x1=x*cy+z*sy, z1=-x*sy+z*cy, y1=y*cp-z1*sp; const k=2.6/(2.6-(y*sp+z1*cp));
    const mx=OX+x1*S*k, my=OY+y1*S*k; const gr=cx.createRadialGradient(mx,my,0,mx,my,S*0.22);
    gr.addColorStop(0,rgba(RENK.ana,0.5*cene)); gr.addColorStop(1,rgba(RENK.ana,0)); cx.fillStyle=gr; cx.beginPath(); cx.ellipse(mx,my,S*0.22,S*0.09*(0.5+cene),0,0,Math.PI*2); cx.fill(); }

  /* --- yazılar --- */
  cx.save(); cx.textAlign='center'; cx.fillStyle = rgba([230,250,255],0.95);
  cx.font = `700 ${Math.round(S*0.2)}px Inter, sans-serif`; cx.letterSpacing = `${S*0.05}px`;
  cx.shadowColor=rgba(RENK.ana,0.9); cx.shadowBlur=18*DPR;
  cx.fillText('J A R V I S', OX, H*0.905);
  cx.shadowBlur=0; cx.font = `600 ${Math.round(S*0.09)}px Inter, sans-serif`;
  const renkD = durum==='konusuyor'?RENK.ana : durum==='dinliyor'?[61,220,151] : durum==='dusunuyor'?RENK.ikinci : [139,155,171];
  cx.letterSpacing = `${2*DPR}px`; cx.fillStyle = rgba(renkD, 0.95); cx.fillText('● ' + ETIKET[durum], OX, H*0.945);
  // altyazı
  if (durum==='konusuyor' && altyazi){ const n = Math.min(altyazi.length, Math.floor((now-altyaziT)/45));
    cx.letterSpacing = '0px'; cx.font = `500 ${Math.round(S*0.1)}px Inter, sans-serif`; cx.fillStyle = rgba([230,240,248],0.92);
    cx.fillText(altyazi.slice(0,n), OX, H*0.985 - 4*DPR); }
  cx.restore();

  /* --- köşe göstergeleri --- */
  cx.save(); cx.font = `500 ${Math.round(12*DPR)}px "JetBrains Mono", monospace`; cx.fillStyle = rgba(RENK.ana,0.7);
  const saat = new Date(); const ss = saat.toLocaleTimeString('tr-TR');
  const sol = ['SİSTEM   ÇEVRİMİÇİ','YEREL    HAZIR','CLAUDE   BAĞLI','ZIGBEE   9 CİHAZ','SALON    22,4°C'];
  sol.forEach((s,i)=> cx.fillText(s, 28*DPR, (40+i*20)*DPR));
  cx.textAlign='right';
  const sag = [ss, 'İŞLEMCİ  ' + (16+Math.round(4*Math.sin(t))) + '%', 'RAM      14/24 GB', 'AĞ       ' + (1.2+0.4*Math.sin(t*1.7)).toFixed(1) + ' MB/s', 'YEDEK    03:00 ✓'];
  sag.forEach((s,i)=> cx.fillText(s, W-28*DPR, (40+i*20)*DPR));
  // alt köşe çerçeve çizgileri
  cx.strokeStyle = rgba(RENK.ana,0.4); cx.lineWidth=1.5*DPR; const m=16*DPR, L=40*DPR;
  [[m,m,1,1],[W-m,m,-1,1],[m,H-m,1,-1],[W-m,H-m,-1,-1]].forEach(([x,y,dx,dy])=>{ cx.beginPath(); cx.moveTo(x,y+dy*L); cx.lineTo(x,y); cx.lineTo(x+dx*L,y); cx.stroke(); });
  cx.restore();

  requestAnimationFrame(ciz);
}
requestAnimationFrame(ciz);
</script>
</body>
</html>
